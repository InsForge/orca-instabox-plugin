name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON
        run: |
          for f in orca-plugin.json recipes/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            echo "ok $f"
          done

      - name: Syntax-check JS
        run: |
          node --check src/lifecycle.js
          node --check scripts/build-recipes.mjs

      - name: Recipes are up to date with src/lifecycle.js
        run: |
          node scripts/build-recipes.mjs
          git diff --exit-code -- recipes/
